# ---------- Server ----------
server.port=8080

# ---------- SQL Server Datasource ----------
# The target database (ems_db) must already exist on your SQL Server instance —
# see README for the CREATE DATABASE script. Username/password are pulled from
# environment variables so credentials never live in source control; DB_USERNAME
# defaults to 'sa' if not set, DB_PASSWORD has no default and must be provided.
spring.datasource.url=jdbc:sqlserver://localhost:53445;databaseName=ems_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------- JPA / Hibernate ----------
# update: keep in dev so the schema is generated from the entities automatically.
# switch to 'validate' once the schema is stable, and use Flyway/Liquibase for real projects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Demo login (see AuthController) ----------
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.ems=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
