# ---------- Server ----------
server.port=8080

# ---------- PostgreSQL Datasource ----------
# On Render: create a PostgreSQL instance (New -> PostgreSQL), then either
# link it to this service (Render can auto-inject DB_URL/DB_USERNAME/DB_PASSWORD)
# or manually copy its "Internal Database URL" into these env vars.
# DB_URL should look like: jdbc:postgresql://<host>:5432/<dbname>
# DB_USERNAME defaults to 'postgres' if not set, DB_PASSWORD has no default.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# update: keep in dev so the schema is generated from the entities automatically.
# switch to 'validate' once the schema is stable, and use Flyway/Liquibase for real projects.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Demo login (see AuthController) ----------
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}
# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.ems=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
